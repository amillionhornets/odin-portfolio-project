<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Knight's Travails</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Knight's Travails</h1>

    <div class="controls">
      <div class="input-group">
        <label for="start">Start Position (e.g. a1):</label>
        <input type="text" id="start" placeholder="a1" value="a1" />
      </div>
      <div class="input-group">
        <label for="end">End Position (e.g. h8):</label>
        <input type="text" id="end" placeholder="h8" value="h8" />
      </div>
      <button id="findPath">Find Path</button>
    </div>

    <div class="board-container">
      <div class="chess-board" id="board">
        <!-- Board squares will be generated by JavaScript -->
      </div>
    </div>

    <div class="path-info hidden" id="pathInfo">
      <h3 id="moveCount">The knight made 0 moves</h3>
      <div class="steps" id="steps">
        <!-- Steps will be added here -->
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
